<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">From experience to a later need</title><desc id="desc">A parcel is observed, gaze is measured with uncertainty, and a later question is paired with verified evidence. Gaze does not prove memory.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372d" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#26372d" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#edf0e3"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#26372d"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1">EXPERIENCE + GAZE + A QUESTION LATER</text><rect x="30" y="65" width="580" height="222" rx="13" fill="#e3e6d7" stroke="#c9d2bd"/><path d="M30 224 330 113 610 218M330 113V65" fill="none" stroke="#c1cbb4"/><path d="m210 163 95-38 106 42-95 42Z" fill="#ddc49f" stroke="#9c886c"/><path d="m210 163 106 46v67l-106-45Z" fill="#c1a47d"/><path d="m316 209 95-42v64l-95 45Z" fill="#ae916c"/><path d="m289 131 25-10 104 42-26 11Z" fill="#f5e8c9"/><rect x="249" y="180" width="45" height="30" rx="3" fill="#fffef9" transform="rotate(22 249 180)"/><circle cx="267" cy="201" r="33" fill="none" stroke="#607d45" stroke-dasharray="4 4" stroke-width="2"/><circle cx="267" cy="201" r="4" fill="#607d45"/><path d="M303 201h132" stroke="#607d45"/><text x="444" y="199" font-size="13">Estimated gaze</text><text x="444" y="220" font-size="11" fill="#68765e">Not proof of recall</text><text x="47" y="91" font-size="12">DAY 1 / PARCEL OBSERVED</text><rect x="30" y="310" width="580" height="120" rx="13" fill="#fffef9" stroke="#c9d2bd"/><text x="49" y="338" font-size="11" fill="#68765e">DAY 2 / A GENUINE MEMORY QUESTION</text><text x="49" y="372" font-size="26">“Did that delivery arrive?”</text><text x="49" y="403" font-size="14" fill="#68765e">Pair the answer with a checked event and its timestamp.</text></g></svg>
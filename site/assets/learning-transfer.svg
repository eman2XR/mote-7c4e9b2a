<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">Transfer an investigation strategy</title><desc id="desc">Three different worlds use state, sequence, and duration. The transferable strategy is to predict, isolate a change, test, and revise.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372d" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#26372d" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#edf0e3"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#26372d"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1">THE REAL TEST / A DIFFERENT MECHANISM</text><text x="30" y="77" font-size="26">Carry the strategy. Discover new rules.</text>
<rect x="26" y="112" width="184" height="200" rx="12" fill="#263d32"/><text x="44" y="139" font-size="11" fill="#d9ed9c">TRAINING WORLD</text><circle cx="83" cy="202" r="22" fill="url(#orb)"/><circle cx="154" cy="202" r="22" fill="url(#violet)"/><text x="44" y="270" font-size="19" fill="#f7f7f0">Hidden states</text><text x="44" y="293" font-size="12" fill="#c2ceba">Light changes a property.</text>
<rect x="228" y="112" width="184" height="200" rx="12" fill="#fffef9" stroke="#c4cfb6"/><text x="246" y="139" font-size="11" fill="#68765e">HELD-OUT WORLD A</text><rect x="250" y="179" width="39" height="44" rx="8" fill="#d9ed9c"/><rect x="301" y="179" width="39" height="44" rx="8" fill="#b8a6bf"/><rect x="352" y="179" width="39" height="44" rx="8" fill="#d8b797"/><text x="264" y="207" font-size="18">2</text><text x="315" y="207" font-size="18">1</text><text x="365" y="207" font-size="18">3</text><text x="246" y="270" font-size="19">Order matters</text><text x="246" y="293" font-size="12" fill="#68765e">Find the switch sequence.</text>
<rect x="430" y="112" width="184" height="200" rx="12" fill="#fffef9" stroke="#c4cfb6"/><text x="448" y="139" font-size="11" fill="#68765e">HELD-OUT WORLD B</text><circle cx="521" cy="202" r="37" fill="none" stroke="#c4cfb6" stroke-width="6"/><path d="M521 165a37 37 0 0 1 37 37" fill="none" stroke="#718855" stroke-width="6"/><path d="M521 177v25l18 13" fill="none" stroke="#26372d" stroke-width="2"/><text x="448" y="270" font-size="19">Duration matters</text><text x="448" y="293" font-size="12" fill="#68765e">Discover an exposure time.</text>
<rect x="26" y="342" width="588" height="84" rx="12" fill="#d9ed9c"/><text x="46" y="373" font-size="18">Predict → Change one thing → Observe → Revise</text><text x="46" y="401" font-size="13">Success means better new predictions within the same action budget.</text></g></svg>
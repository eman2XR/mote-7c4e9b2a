<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">A quiet command</title><desc id="desc">A deliberate touch on a wearable selects Save. Ordinary movement should produce no command. These are proposed interactions.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#111827" opacity=".09"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m2 2 5 3-5 3" fill="none" stroke="#17202b" stroke-width="1.4"/></marker></defs><rect width="720" height="480" fill="#f5effd"/><rect width="720" height="480" fill="url(#dots)"/><g font-family="Arial,Helvetica,sans-serif" fill="#17202b"><circle cx="256" cy="236" r="144" fill="none" stroke="#d7c4f3"/><circle cx="256" cy="236" r="113" fill="none" stroke="#d7c4f3" stroke-dasharray="3 8"/><path d="M143 369 163 305 191 270v-91q0-19 16-19t16 19v68l12-105q2-18 18-17t14 21l-7 96 14-81q4-17 18-15t12 23l-9 83 14-47q6-16 18-12t8 22l-15 87-35 58-13 48" fill="#fdfbff" stroke="#57456f" stroke-width="2"/><path d="m164 305 52-48q14-12 25-1t-1 24l-28 30" fill="#fdfbff" stroke="#57456f" stroke-width="2"/><path d="M233 204q14 7 29 1l-1 23q-14 6-29-1Z" fill="#8252bb"/><rect x="235" y="208" width="24" height="13" rx="6" fill="#cdb7f0"/><circle cx="247" cy="214" r="28" fill="none" stroke="#8252bb" stroke-width="2"/><path d="M276 214h137" stroke="#8252bb" stroke-width="2"/><rect x="415" y="174" width="240" height="80" fill="#8252bb"/><text x="435" y="200" font-family="monospace" font-size="11" fill="#ece3fa">DELIBERATE PRESS</text><text x="435" y="233" font-size="27" fill="#fff">Save this.</text><path d="M414 298h241" stroke="#cbb6e7"/><text x="433" y="327" font-size="13" fill="#685778">Ordinary movement</text><text x="433" y="354" font-size="20">No command.</text><text x="57" y="63" font-family="monospace" font-size="12" fill="#7148a2">TOUCH  /  GESTURE  /  POINT</text><text x="57" y="440" font-family="monospace" font-size="11" fill="#7148a2">ILLUSTRATIVE INTERACTION · NOT BUILT HARDWARE</text></g></svg>
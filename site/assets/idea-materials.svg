<text x="30" y="38" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#72806a">APPEARANCE DOESN’T TELL THE WHOLE STORY</text>
<rect x="29" y="73" width="278" height="257" rx="14" fill="#fffdf5" stroke="#ced7c0"/><rect x="333" y="73" width="278" height="257" rx="14" fill="#fffdf5" stroke="#ced7c0"/>
<text x="49" y="106" font-size="14" fill="#718064">Same test setup</text><text x="353" y="106" font-size="14" fill="#718064">Different material</text>

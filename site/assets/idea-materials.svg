<text x="168" y="309" text-anchor="middle" font-size="16">Holds its shape.</text><text x="472" y="309" text-anchor="middle" font-size="16">Falls into folds.</text>
<text x="320" y="379" text-anchor="middle" font-size="22">“What will it do when I move it?”</text><text x="320" y="412" text-anchor="middle" font-size="13" fill="#718064">Video + controlled action + measured properties · schematic, not a simulation</text>
</g></svg>
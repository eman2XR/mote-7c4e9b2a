<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Looks similar, behaves differently</title><desc id="desc">Two schematic fabric swatches have similar color but different bending behavior under the same setup. Measured properties and motion could support models of material behavior.</desc><defs>

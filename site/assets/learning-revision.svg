<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">An experiment changes an explanation</title><desc id="desc">An initial color hypothesis predicts no change after light exposure. The observed reversal leads to a revised hypothesis.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372d" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#26372d" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#edf0e3"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#26372d"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1">ONE INVESTIGATION / ILLUSTRATIVE TRACE</text><path d="M58 87v282" stroke="#a8b998" stroke-width="2"/>
<circle cx="58" cy="96" r="15" fill="#d9ed9c"/><text x="53" y="101" font-size="13">1</text><text x="91" y="91" font-size="11" fill="#68765e">HYPOTHESIS</text><text x="91" y="119" font-size="23">“Maybe color controls attraction.”</text>
<circle cx="58" cy="183" r="15" fill="#d9ed9c"/><text x="53" y="188" font-size="13">2</text><text x="91" y="177" font-size="11" fill="#68765e">TEST + PREDICTION</text><text x="91" y="204" font-size="18">Change the light. Keep the same pair.</text><text x="91" y="228" font-size="14" fill="#68765e">If color alone matters, the outcome should stay the same.</text>
<circle cx="58" cy="279" r="15" fill="#dfb9a4"/><text x="53" y="284" font-size="13">3</text><text x="91" y="273" font-size="11" fill="#875239">OBSERVATION</text><text x="91" y="300" font-size="21">Same colors. Opposite movement.</text>
<rect x="30" y="335" width="580" height="95" rx="12" fill="#26372d"/><text x="50" y="362" font-size="11" fill="#d9ed9c">REVISE THE EXPLANATION</text><text x="50" y="392" font-size="21" fill="#f7f7f0">“The light changes something I can’t see.”</text><text x="50" y="414" font-size="12" fill="#c2ceba">A new hypothesis to test, not a proven rule yet.</text></g></svg>
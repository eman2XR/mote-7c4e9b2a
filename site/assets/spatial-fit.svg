<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">A room can fit the furniture and still fail the task</title><desc id="desc">Two schematic floor plans compare a sofa that blocks the entrance route with a placement that leaves a clear path. A plausible-looking layout is not sufficient evidence of usability.</desc><defs>

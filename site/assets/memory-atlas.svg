<use href="#keys" transform="translate(335 290) rotate(-20) scale(.9)"/>
<ellipse cx="334" cy="287" rx="56" ry="30" fill="none" stroke="#738856" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="53" y="88" width="147" height="37" rx="18" fill="#fffef9"/><circle cx="72" cy="106" r="4" fill="#789254"/><text x="84" y="111" font-size="13">08:42 · observed</text>
<path d="M385 291h134v124" fill="none" stroke="#72865c" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arrow-tip)"/>
<g filter="url(#shadow)"><rect x="48" y="406" width="544" height="120" rx="15" fill="#fffef9" stroke="#d3dcc5"/></g>
<text x="71" y="436" font-family="monospace" font-size="11" letter-spacing="1" fill="#6c795f">LATER: “WHERE DID I LEAVE MY KEYS?”</text>
<use href="#check" x="83" y="467"/><text x="106" y="473" font-size="22">Last seen on the kitchen table.</text>
<text x="106" y="502" font-size="13" fill="#72806a">08:42 · linked to this moment · later location unknown</text>
</g></svg>
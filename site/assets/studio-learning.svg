<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">An experiment changes the explanation</title><desc id="desc">The same two objects move together before light exposure and apart afterward. The outcome contradicts a hypothesis based only on color.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#111827" opacity=".09"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m2 2 5 3-5 3" fill="none" stroke="#17202b" stroke-width="1.4"/></marker></defs><rect width="720" height="480" fill="#fff2e9"/><rect width="720" height="480" fill="url(#dots)"/><g font-family="Arial,Helvetica,sans-serif" fill="#17202b"><rect x="58" y="62" width="604" height="344" fill="#fffaf6" stroke="#edcbb7"/><text x="82" y="96" font-family="monospace" font-size="12" fill="#b84b1d">01  /  MAKE A PREDICTION</text><path d="M58 118h604M58 263h604" stroke="#edcbb7"/><text x="83" y="149" font-size="12" fill="#866d5e">BEFORE</text><circle cx="246" cy="194" r="35" fill="#e66d35"/><circle cx="478" cy="194" r="35" fill="#edc0a5" stroke="#b84b1d"/><path d="M300 194h38" stroke="#17202b" stroke-width="2" marker-end="url(#arrow)"/><path d="M424 194h-38" stroke="#17202b" stroke-width="2" marker-end="url(#arrow)"/><text x="332" y="235" font-size="13">Attract</text><text x="83" y="294" font-size="12" fill="#866d5e">AFTER LIGHT</text><circle cx="246" cy="338" r="35" fill="#e66d35"/><circle cx="478" cy="338" r="35" fill="#edc0a5" stroke="#b84b1d"/><path d="M336 338h-38" stroke="#17202b" stroke-width="2" marker-end="url(#arrow)"/><path d="M388 338h38" stroke="#17202b" stroke-width="2" marker-end="url(#arrow)"/><path d="m467 275-25 95h70l-24-95" fill="#f1c04b" opacity=".25"/><path d="m475 271-8 17h13l-7 18 23-25h-13l8-10" fill="#b84b1d"/><text x="335" y="382" font-size="13">Repel</text><rect x="335" y="425" width="327" height="32" fill="#17202b"/><text x="349" y="446" font-family="monospace" font-size="11" fill="#fff">SAME COLORS. A NEW HYPOTHESIS NEEDED.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">A laboratory for learning</title><desc id="desc">A hypothetical tabletop world. Objects move together before a light exposure and apart afterward. The learner must discover why.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f4f4e9" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#f4f4e9" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#1d302b"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f4f4e9"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#b9cbb6">FIELD NOTE 002 / LEARNING TO LEARN</text><text x="30" y="76" font-size="25">Same objects. A different outcome.</text><path d="m52 271 269-123 269 123-269 132Z" fill="#32483c" stroke="#62775e"/><path d="m52 271 269 132 269-132v12L321 416 52 283Z" fill="#15251f"/><ellipse cx="236" cy="286" rx="46" ry="17" fill="#14261d"/><ellipse cx="409" cy="286" rx="46" ry="17" fill="#14261d"/><circle cx="236" cy="248" r="32" fill="url(#orb)"/><circle cx="409" cy="248" r="32" fill="url(#violet)"/><path d="M286 247h63" stroke="#e5eddb" stroke-width="1.5" stroke-dasharray="4 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="m419 123-61 168h102l-20-168" fill="#f5e7a1" opacity=".11"/><rect x="402" y="108" width="52" height="17" rx="8" fill="#e8dfac"/><path d="M428 108V86" stroke="#93a38a" stroke-width="3"/><text x="465" y="122" font-size="12" fill="#d8dfcd">Change one thing:</text><text x="465" y="141" font-size="12" fill="#d8dfcd">expose to light.</text><rect x="32" y="344" width="235" height="77" rx="10" fill="#f4f4e9"/><text x="48" y="368" fill="#65725b" font-size="10" letter-spacing="1">BEFORE / OBSERVATION</text><text x="48" y="396" fill="#26372d" font-size="18">The pair moves together.</text><rect x="350" y="344" width="258" height="77" rx="10" fill="#d9ed9c"/><text x="366" y="368" fill="#52633c" font-size="10" letter-spacing="1">AFTER / NEW EVIDENCE</text><text x="366" y="396" fill="#26372d" font-size="18">Now they move apart.</text></g></svg>
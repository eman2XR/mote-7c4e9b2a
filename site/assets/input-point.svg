<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">Select the object, then the request</title><desc id="desc">An illustrated pointing ray selects one of three objects, followed by an explicit confirm action. Direction alone does not establish intent.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372d" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#26372d" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#edf0e3"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#26372d"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1">REFERENCE + INTENT / TWO DIFFERENT SIGNALS</text><text x="30" y="78" font-size="26">Which thing? What should happen?</text><rect x="30" y="105" width="580" height="200" rx="12" fill="#e4e8d9"/><ellipse cx="145" cy="248" rx="40" ry="13" fill="#c5cdb8"/><path d="M119 174h51v63q-25 23-51 0Z" fill="#bf9574"/><path d="M170 184q38-3 27 28-8 17-27 5" fill="none" stroke="#bf9574" stroke-width="8"/><ellipse cx="145" cy="174" rx="26" ry="10" fill="#e3c29e"/><rect x="285" y="161" width="61" height="85" rx="10" fill="#faf9ee" stroke="#8a977b" stroke-width="2"/><path d="M301 161v-17M330 161v-17" stroke="#8a977b" stroke-width="4"/><rect x="272" y="134" width="87" height="127" rx="17" fill="none" stroke="#789259" stroke-dasharray="5 5" stroke-width="2"/><path d="M315 292v-34" stroke="#789259" stroke-width="2" marker-end="url(#arrow)"/><path d="m458 182 56-16 27 68-56 17Z" fill="#c6b5cf" stroke="#8f7d98"/><text x="48" y="286" font-size="12" fill="#68765e">POINT / estimated target</text><rect x="30" y="330" width="580" height="98" rx="12" fill="#26372d"/><text x="50" y="359" font-size="11" fill="#d9ed9c">CONFIRM / EXPLICIT REQUEST</text><text x="50" y="390" font-size="22" fill="#f7f7f0">“Remember this object”</text><text x="50" y="413" font-size="12" fill="#c2ceba">Pointing or looking alone should not trigger the command.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">An action needs more than a single frame</title><desc id="desc">A charger visible beside a bag does not prove it was packed. An observed sequence of the charger being placed in the bag supports a completed-action record.</desc><defs>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f1f2e8"/><stop offset="1" stop-color="#e4e9d8"/></linearGradient>
<linearGradient id="wood" x2="1" y2="1"><stop stop-color="#e8d4b5"/><stop offset="1" stop-color="#cfb68e"/></linearGradient>
<linearGradient id="bag-fill" x2="1" y2="1"><stop stop-color="#98aa7a"/><stop offset="1" stop-color="#657c50"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#21362a" flood-opacity=".09"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#798c6b" opacity=".2"/></pattern>
<marker id="arrow-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#667a52" stroke-width="1.5"/></marker>
<g id="keys"><ellipse cx="0" cy="9" rx="33" ry="8" fill="#26372d" opacity=".08"/><circle cx="-12" cy="-4" r="13" fill="none" stroke="#78827b" stroke-width="4"/><path d="m-3 4 26 17 7-8-8-5-5 5-6-4 4-5-12-8Z" fill="#d7d9cd" stroke="#778278" stroke-width="1.4"/><path d="m-1-9 29-2 5 13-31 2Z" fill="#d9ed9c" stroke="#6a7f4d" stroke-width="1.4"/><circle cx="7" cy="-3" r="2.4" fill="#6a7f4d"/></g>
<g id="bag"><path d="M-48-28Q0-39 48-28L59 59Q0 78-59 59Z" fill="url(#bag-fill)" stroke="#5f744b" stroke-width="2"/><path d="M-29-29v-24q0-37 29-37t29 37v24" fill="none" stroke="#647b4e" stroke-width="9"/><path d="M-27-30v-23q0-33 27-33t27 33v23" fill="none" stroke="#b7c49f" stroke-width="3"/><path d="M-48-28Q0-13 48-28M-39-18l-4 71M39-18l4 71" fill="none" stroke="#c2cba8" stroke-width="1.5" opacity=".7"/><path d="M-18 6h36v25h-36Z" fill="#e5e9d2" opacity=".65"/></g>
<g id="charger"><rect x="-21" y="-20" width="42" height="40" rx="9" fill="#fffef8" stroke="#8a9780" stroke-width="1.7"/><path d="M-8-20v-10M8-20v-10" stroke="#899583" stroke-width="4"/><path d="M0 20v12q0 23 25 23t25-18q0-15-17-15" fill="none" stroke="#fffef8" stroke-width="7"/><path d="M0 20v12q0 23 25 23t25-18q0-15-17-15" fill="none" stroke="#a2ad96" stroke-width="1.5"/></g>
<g id="eye"><path d="M-16 0q16-20 32 0-16 20-32 0Z" fill="none" stroke="currentColor" stroke-width="2"/><circle r="5" fill="none" stroke="currentColor" stroke-width="2"/></g>
<g id="check"><circle r="12" fill="#d9ed9c"/><path d="m-5 0 3 4 7-8" fill="none" stroke="#3f5a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>
<rect width="640" height="460" rx="22" fill="#edf0e3"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#26372d">
<text x="30" y="38" font-family="monospace" font-size="11" letter-spacing="1.7" fill="#72806a">OBJECT PRESENT ≠ ACTION COMPLETED</text>
<rect x="28" y="67" width="270" height="268" rx="15" fill="#f8f8ef" stroke="#d0d8c4"/>
<rect x="342" y="67" width="270" height="268" rx="15" fill="#f8f8ef" stroke="#b8cba0"/>
<text x="48" y="100" font-size="14" fill="#718064">A single frame</text><text x="362" y="100" font-size="14" fill="#718064">An observed change</text>
<use href="#bag" transform="translate(199 217) scale(.75)"/><use href="#charger" transform="translate(93 228) scale(.75)"/>
<path d="M62 289h202" stroke="#c6cfb9" stroke-width="1.5"/>
<use href="#bag" transform="translate(478 230) scale(.86)"/><use href="#charger" transform="translate(476 142) scale(.65)"/>
<path d="M477 172v34" stroke="#6f8753" stroke-width="2" marker-end="url(#arrow-tip)"/>
<circle cx="553" cy="265" r="19" fill="#d9ed9c"/><path d="m546 265 5 5 9-11" fill="none" stroke="#4b6537" stroke-width="2.3"/>
<text x="163" y="314" text-anchor="middle" font-size="15">“There is a charger.”</text><text x="477" y="314" text-anchor="middle" font-size="15">“The charger went in.”</text>
<path d="M306 196h28" stroke="#9da98c" stroke-width="1.7" marker-end="url(#arrow-tip)"/>
<text x="320" y="373" text-anchor="middle" font-size="21">“Did I pack my charger?”</text>
<text x="320" y="407" text-anchor="middle" font-size="14" fill="#718064">A useful memory tracks the event and its supporting frames.</text>
</g></svg>
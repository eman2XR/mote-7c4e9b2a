<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Preference depends on the person and the purpose</title><desc id="desc">Two rooms with different visual styles are presented as alternatives. A stated purpose and explicit preference are recorded instead of assuming a universally best design.</desc><defs>

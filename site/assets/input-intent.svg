<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">A small gesture, an intentional command</title><desc id="desc">A ring worn on an illustrated finger detects a deliberate thumb press. An ordinary grip should not trigger a command.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372d" stroke-opacity=".07"/></pattern><radialGradient id="orb"><stop stop-color="#f2ffc6"/><stop offset=".7" stop-color="#c5e58c"/><stop offset="1" stop-color="#718c59"/></radialGradient><radialGradient id="violet"><stop stop-color="#efdfef"/><stop offset="1" stop-color="#a18baa"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#26372d" stroke-width="1.5"/></marker></defs><rect width="640" height="460" rx="20" fill="#edf0e3"/><rect width="640" height="460" rx="20" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" fill="#26372d"><text x="30" y="36" font-family="monospace" font-size="11" letter-spacing="1">FIELD NOTE 003 / INPUT</text><text x="30" y="79" font-size="27">A small movement. A clear intention.</text><rect x="30" y="107" width="580" height="205" rx="14" fill="#e4e8d9" stroke="#c9d2bd"/><path d="M118 290 147 247 181 229 183 162q0-18 15-18t16 18v65l12-81q3-18 17-15t12 20l-8 72 18-60q5-17 18-12t9 22l-13 68 17-35q8-13 18-7t4 22l-27 56-43 21" fill="#d7b99c" stroke="#8d7760" stroke-width="2"/><path d="m148 246 52-35q15-9 25 2t-5 23l-32 26" fill="#dfc5aa" stroke="#8d7760" stroke-width="2"/><path d="M182 188q17 7 34 1v18q-17 7-34-1Z" fill="#6e8160" stroke="#425b37" stroke-width="2"/><rect x="188" y="190" width="19" height="12" rx="5" fill="#d9ed9c"/><circle cx="199" cy="198" r="28" fill="none" stroke="#7f975f" stroke-dasharray="4 5"/><path d="M233 197h117" stroke="#82966d"/><text x="368" y="181" font-size="12" fill="#68765e">PROPOSED MAPPING</text><text x="368" y="211" font-size="25">Press → “Save this”</text><text x="368" y="239" font-size="13" fill="#68765e">Confirm with a subtle signal.</text><text x="368" y="261" font-size="13" fill="#68765e">Context comes from a paired device.</text><rect x="30" y="336" width="280" height="93" rx="12" fill="#26372d"/><text x="48" y="363" font-size="11" fill="#d9ed9c">INTENTIONAL INPUT</text><text x="48" y="395" font-size="20" fill="#f7f7f0">A deliberate command.</text><rect x="330" y="336" width="280" height="93" rx="12" fill="#fffef9" stroke="#c9d2bd"/><text x="348" y="363" font-size="11" fill="#68765e">ORDINARY MOVEMENT</text><text x="348" y="395" font-size="20">Picking up a cup: no action.</text></g></svg>